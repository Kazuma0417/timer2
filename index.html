<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無音円形タイマー</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.3);
            --accent: #f43f5e;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 0.05em;
        }

        /* モード切り替えタブ */
        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 4px;
            width: 100%;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab.active {
            background: var(--primary);
            color: #0f172a;
            font-weight: 600;
            box-shadow: 0 2px 8px var(--primary-glow);
        }

        /* 設定パネル */
        .panel {
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
        }

        .panel.active {
            display: flex;
        }

        .input-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
        }

        select, input {
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--primary);
        }

        .select-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .preset-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .preset-btn:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--primary);
        }

        /* 円形タイマー表示 */
        .timer-display-container {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 10px 0 24px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .progress-ring {
            transform: rotate(-90deg) scaleX(-1);
        }

        .progress-ring__circle-bg {
            stroke: var(--border);
            fill: none;
            stroke-width: 10;
        }

        .progress-ring__circle {
            stroke: var(--primary);
            fill: none;
            stroke-width: 10;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s linear;
        }

        .timer-text-group {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .time-left {
            font-size: 2.75rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.03em;
        }

        .time-target-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* コントロールボタン */
        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background-color: var(--primary);
            color: #0f172a;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
        }

        .btn-danger {
            background-color: var(--accent);
            color: white;
        }

        /* スリープ防止設定 */
        .wake-lock-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--border);
            transition: .3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(18px);
        }

        /* 完了時のフラッシュアニメーション */
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(56, 189, 248, 0); }
            100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }

        .finished {
            animation: pulse-border 1.5s infinite;
        }
        
        .finished .progress-ring__circle {
            stroke: var(--accent);
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h1>サイレントタイマー</h1>

        <!-- モード切替 -->
        <div class="tabs">
            <button class="tab active" data-mode="duration">残り時間</button>
            <button class="tab" data-mode="target">時刻指定</button>
        </div>

        <!-- ① 残り時間モードパネル -->
        <div class="panel active" id="durationPanel">
            <div class="input-group">
                <div class="select-wrapper">
                    <select id="durHours">
                        <!-- JSで生成 -->
                    </select>
                    <span>時間</span>
                </div>
                <div class="select-wrapper">
                    <select id="durMins">
                        <!-- JSで生成 -->
                    </select>
                    <span>分</span>
                </div>
            </div>
            <div class="preset-buttons">
                <button class="preset-btn" onclick="setDuration(1, 0)">+1分</button>
                <button class="preset-btn" onclick="setDuration(5, 0)">+5分</button>
                <button class="preset-btn" onclick="setDuration(10, 0)">+10分</button>
                <button class="preset-btn" onclick="setDuration(30, 0)">+30分</button>
            </div>
        </div>

        <!-- ② 時刻指定モードパネル -->
        <div class="panel" id="targetPanel">
            <div class="input-group">
                <div class="select-wrapper">
                    <select id="targetHour">
                        <!-- JSで生成 -->
                    </select>
                    <span>時</span>
                </div>
                <div class="select-wrapper">
                    <select id="targetMinute">
                        <!-- JSで生成 -->
                    </select>
                    <span>分まで</span>
                </div>
            </div>
            <div class="preset-buttons">
                <button class="preset-btn" onclick="addTargetMinutes(10)">+10分後</button>
                <button class="preset-btn" onclick="addTargetMinutes(30)">+30分後</button>
                <button class="preset-btn" onclick="addTargetMinutes(60)">+1時間後</button>
                <button class="preset-btn" onclick="setNextHourMark()">次の00分</button>
            </div>
        </div>

        <!-- 円形タイマー部分 -->
        <div class="timer-display-container">
            <svg class="progress-ring" width="260" height="260">
                <circle class="progress-ring__circle-bg" cx="130" cy="130" r="115" />
                <circle class="progress-ring__circle" id="progressRing" cx="130" cy="130" r="115" 
                        stroke-dasharray="722.56" stroke-dashoffset="0" />
            </svg>
            <div class="timer-text-group">
                <div class="time-left" id="timeDisplay">00:00</div>
                <div class="time-target-info" id="targetInfo">設定してください</div>
            </div>
        </div>

        <!-- 操作ボタン -->
        <div class="controls" id="controlButtons">
            <button class="btn btn-primary" id="startBtn" onclick="startTimer()">スタート</button>
            <button class="btn btn-secondary" id="resetBtn" onclick="resetTimer()">リセット</button>
        </div>

        <!-- スリープ防止設定 -->
        <div class="wake-lock-status">
            <span>画面スリープ防止</span>
            <label class="toggle-switch">
                <input type="checkbox" id="wakeLockToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <script>
        // --- プルダウンの初期化 ---
        const durHoursSelect = document.getElementById('durHours');
        const durMinsSelect = document.getElementById('durMins');
        const targetHourSelect = document.getElementById('targetHour');
        const targetMinuteSelect = document.getElementById('targetMinute');

        for (let i = 0; i <= 24; i++) {
            durHoursSelect.add(new Option(String(i).padStart(2, '0'), i));
        }
        for (let i = 0; i < 60; i++) {
            durMinsSelect.add(new Option(String(i).padStart(2, '0'), i));
        }
        durMinsSelect.value = "5"; // デフォルト5分

        for (let i = 0; i < 24; i++) {
            targetHourSelect.add(new Option(String(i).padStart(2, '0'), i));
        }
        for (let i = 0; i < 60; i += 5) { // 5分刻み
            targetMinuteSelect.add(new Option(String(i).padStart(2, '0'), i));
        }

        // 現在時刻を目標時刻のデフォルトに設定
        const nowInit = new Date();
        targetHourSelect.value = nowInit.getHours();
        let roundedMin = Math.ceil(nowInit.getMinutes() / 5) * 5;
        if (roundedMin >= 60) {
            roundedMin = 0;
            targetHourSelect.value = (Number(targetHourSelect.value) + 1) % 24;
        }
        targetMinuteSelect.value = roundedMin;

        // --- タブ切り替え ---
        let currentMode = 'duration'; // 'duration' or 'target'
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                if (isRunning) return; // 実行中は切替不可
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentMode = tab.dataset.mode;
                
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                if (currentMode === 'duration') {
                    document.getElementById('durationPanel').classList.add('active');
                } else {
                    document.getElementById('targetPanel').classList.add('active');
                }
                updateInitialDisplay();
            });
        });

        // --- タイマーロジック変数 ---
        let totalSeconds = 300; // デフォルト5分
        let remainingSeconds = 300;
        let timerInterval = null;
        let isRunning = false;
        let targetEndTime = null;

        const timeDisplay = document.getElementById('timeDisplay');
        const targetInfo = document.getElementById('targetInfo');
        const progressRing = document.getElementById('progressRing');
        const circumference = 2 * Math.PI * 115; // r = 115
        progressRing.style.strokeDasharray = circumference;

        function setProgress(percent) {
            const offset = circumference - (percent / 100) * circumference;
            progressRing.style.strokeDashoffset = offset;
        }

        function formatTime(secs) {
            const h = Math.floor(secs / 3600);
            const m = Math.floor((secs % 3600) / 60);
            const s = secs % 60;
            if (h > 0) {
                return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function updateInitialDisplay() {
            if (isRunning) return;
            calculateSeconds();
            remainingSeconds = totalSeconds;
            timeDisplay.textContent = formatTime(remainingSeconds);
            setProgress(100);

            if (currentMode === 'target' && targetEndTime) {
                const h = String(targetEndTime.getHours()).padStart(2, '0');
                const m = String(targetEndTime.getMinutes()).padStart(2, '0');
                targetInfo.textContent = `${h}:${m} まで`;
            } else if (currentMode === 'duration') {
                targetInfo.textContent = '残り時間タイマー';
            }
        }

        function calculateSeconds() {
            if (currentMode === 'duration') {
                const h = parseInt(durHoursSelect.value) || 0;
                const m = parseInt(durMinsSelect.value) || 0;
                totalSeconds = h * 3600 + m * 60;
                if (totalSeconds <= 0) totalSeconds = 60; // 最低1分
            } else {
                const now = new Date();
                const target = new Date();
                target.setHours(parseInt(targetHourSelect.value));
                target.setMinutes(parseInt(targetMinuteSelect.value));
                target.setSeconds(0);
                
                if (target <= now) {
                    target.setDate(target.getDate() + 1);
                }
                targetEndTime = target;
                totalSeconds = Math.floor((target - now) / 1000);
            }
        }

        // プリセット用ヘルパー
        window.setDuration = function(m, h = 0) {
            if (isRunning) return;
            durHoursSelect.value = h;
            durMinsSelect.value = m;
            updateInitialDisplay();
        };

        window.addTargetMinutes = function(mins) {
            if (isRunning) return;
            const now = new Date();
            now.setMinutes(now.getMinutes() + mins);
            targetHourSelect.value = now.getHours();
            let m = Math.round(now.getMinutes() / 5) * 5;
            if (m >= 60) {
                m = 0;
                targetHourSelect.value = (Number(targetHourSelect.value) + 1) % 24;
            }
            targetMinuteSelect.value = m;
            updateInitialDisplay();
        };

        window.setNextHourMark = function() {
            if (isRunning) return;
            const now = new Date();
            let h = (now.getHours() + 1) % 24;
            targetHourSelect.value = h;
            targetMinuteSelect.value = 0;
            updateInitialDisplay();
        };

        [durHoursSelect, durMinsSelect, targetHourSelect, targetMinuteSelect].forEach(el => {
            el.addEventListener('change', updateInitialDisplay);
        });

        // --- Wake Lock (画面スリープ防止) API ---
        let wakeLock = null;
        const wakeLockToggle = document.getElementById('wakeLockToggle');

        async function requestWakeLock() {
            if (!wakeLockToggle.checked) return;
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.error(`Wake Lock error: ${err.name}, ${err.message}`);
            }
        }

        async function releaseWakeLock() {
            if (wakeLock !== null) {
                try {
                    await wakeLock.release();
                    wakeLock = null;
                } catch (err) {
                    console.error(`Wake Lock release error: ${err.name}, ${err.message}`);
                }
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && isRunning) {
                await requestWakeLock();
            }
        });

        // --- タイマー制御 ---
        window.startTimer = async function() {
            if (isRunning) return;
            calculateSeconds();
            if (totalSeconds <= 0) return;

            remainingSeconds = totalSeconds;
            isRunning = true;

            document.getElementById('mainContainer').classList.remove('finished');
            document.querySelectorAll('select, .tab, .preset-btn').forEach(el => el.disabled = true);
            const startBtn = document.getElementById('startBtn');
            startBtn.textContent = '一時停止';
            startBtn.className = 'btn btn-secondary';
            startBtn.onclick = pauseTimer;

            await requestWakeLock();

            const startTime = Date.now();
            const initialRemaining = remainingSeconds;

            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                remainingSeconds = initialRemaining - elapsed;

                if (remainingSeconds <= 0) {
                    remainingSeconds = 0;
                    finishTimer();
                }

                timeDisplay.textContent = formatTime(remainingSeconds);
                const percent = (remainingSeconds / totalSeconds) * 100;
                setProgress(percent);
            }, 200);
        };

        window.pauseTimer = function() {
            if (!isRunning) return;
            clearInterval(timerInterval);
            isRunning = false;

            const startBtn = document.getElementById('startBtn');
            startBtn.textContent = '再開';
            startBtn.className = 'btn btn-primary';
            startBtn.onclick = startTimer;

            releaseWakeLock();
        };

        function finishTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            remainingSeconds = 0;
            timeDisplay.textContent = "00:00";
            setProgress(0);

            document.getElementById('mainContainer').classList.add('finished');
            targetInfo.textContent = "時間になりました";

            const startBtn = document.getElementById('startBtn');
            startBtn.textContent = 'スタート';
            startBtn.className = 'btn btn-primary';
            startBtn.onclick = startTimer;

            releaseWakeLock();
        }

        window.resetTimer = function() {
            clearInterval(timerInterval);
            isRunning = false;
            document.getElementById('mainContainer').classList.remove('finished');
            
            document.querySelectorAll('select, .tab, .preset-btn').forEach(el => el.disabled = false);
            const startBtn = document.getElementById('startBtn');
            startBtn.textContent = 'スタート';
            startBtn.className = 'btn btn-primary';
            startBtn.onclick = startTimer;

            releaseWakeLock();
            updateInitialDisplay();
        };

        updateInitialDisplay();
    </script>
</body>
</html>
